<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registrar - VetSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="inicio.html"><i class="bi bi-heart-pulse"></i> VetSystem</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="inicio.html"><i class="bi bi-house"></i> Inicio</a>
            <a class="nav-link active" href="registrar.html"><i class="bi bi-plus-circle"></i> Registrar</a>
            <a class="nav-link" href="pacientes.html"><i class="bi bi-list-ul"></i> Pacientes</a>
            <a class="nav-link" href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a>
        </div>
        <span class="navbar-text text-white me-3"><i class="bi bi-person-circle"></i> admin (Administrador)</span>
        <a class="btn btn-outline-light btn-sm" href="login.html"><i class="bi bi-box-arrow-right"></i> Salir</a>
    </div>
</nav>

<main class="container my-4">
    <div class="alert alert-info d-flex align-items-center border-0 shadow-sm">
        <i class="bi bi-server me-2 fs-5"></i>
        <span>Solicitud atendida por el nodo: <strong>app-01</strong></span>
    </div>

    <h2 class="mb-3"><i class="bi bi-clipboard-plus text-primary"></i> Registrar nuevo paciente</h2>

    <form class="card p-4 shadow-sm border-0">
        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-person"></i> Datos del dueño</h5>
        <div class="row g-3 mb-4 mt-1">
            <div class="col-md-6"><label class="form-label fw-semibold">Nombre *</label>
                <input type="text" class="form-control" placeholder="Ej: Juan Pérez" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Teléfono</label>
                <input type="text" class="form-control" placeholder="Ej: 5555-1234"></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" placeholder="ejemplo@correo.com"></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Dirección</label>
                <input type="text" class="form-control" placeholder="Ej: Zona 1, Guatemala"></div>
        </div>

        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-github"></i> Datos de la mascota</h5>
        <div class="row g-3 mb-4 mt-1">
            <div class="col-md-6"><label class="form-label fw-semibold">Nombre *</label>
                <input type="text" class="form-control" placeholder="Ej: Firulais" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Especie</label>
                <select class="form-select">
                    <option>Perro</option>
                    <option>Gato</option>
                    <option>Ave</option>
                    <option>Otro</option>
                </select></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Raza</label>
                <input type="text" class="form-control" placeholder="Ej: Labrador"></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Edad (años)</label>
                <input type="number" class="form-control" placeholder="Ej: 3"></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Peso (kg)</label>
                <input type="number" step="0.01" class="form-control" placeholder="Ej: 12.5"></div>
        </div>

        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-clipboard-pulse"></i> Motivo de la consulta</h5>
        <div class="mb-3 mt-3"><label class="form-label fw-semibold">Motivo *</label>
            <textarea class="form-control" rows="3" placeholder="Describe el motivo de la consulta..." required></textarea></div>
        <div class="mb-3"><label class="form-label fw-semibold">Diagnóstico (opcional)</label>
            <textarea class="form-control" rows="2" placeholder="Ingresa el diagnóstico si aplica..."></textarea></div>

        <div class="d-flex gap-2 border-top pt-3">
            <button class="btn btn-primary px-4"><i class="bi bi-save"></i> Guardar Paciente</button>
            <a href="inicio.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
